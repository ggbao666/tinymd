<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' app-file: data: https: http:; connect-src 'self' ws: http: https:; font-src 'self'"
    />
    <title>tinymd</title>
  </head>
  <body>
    <!-- 欢迎页：打开目录才能进入编辑器 -->
    <div id="view-welcome">
      <div class="welcome-inner">
        <div class="app-mark">
          <svg viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
            <path d="M50.5 12 C53.5 38 49.5 58 50.5 68 C51.5 80 66.5 84.5 71.5 71.5" stroke-width="17"/>
            <path d="M24.5 32.5 C42 29 60 26.5 77.5 29" stroke-width="14.4"/>
          </svg>
        </div>
        <h1>tinymd</h1>
        <p class="tagline">安静的 Markdown 工作空间</p>
        <button id="btn-open-folder" class="btn-primary">打开文件夹…</button>
        <div id="recents" class="recents"></div>
        <p class="hint">在访达 / 资源管理器中右键 Markdown 文件，也可以直接用「tinymd」打开。</p>
      </div>
    </div>

    <!-- 工作区 -->
    <div id="view-workspace" class="hidden">
      <header id="topbar">
        <div class="topbar-left">
          <button id="btn-sidebar" class="icon-btn" title="切换边栏 (Ctrl+\)">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="1.8" y="2.5" width="12.4" height="11" rx="2"/><path d="M6.2 2.5v11"/></svg>
          </button>
          <div id="breadcrumb"></div>
        </div>
        <div class="topbar-right">
          <span id="status"></span>
          <button id="btn-source-mode" class="icon-btn" title="切换到纯文本模式" aria-label="切换到纯文本模式" aria-pressed="false">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"><path d="m6.5 4.5-4 4.5 4 4.5M11.5 4.5l4 4.5-4 4.5M10.2 3.2 7.8 14.8"/></svg>
          </button>
          <button id="btn-image-settings" class="icon-btn" title="设置" aria-label="设置" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.09a2 2 0 0 1 1 1.74v.5a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </header>

      <div class="ws-body">
        <aside id="sidebar">
          <div id="sidebar-header">
            <div id="sidebar-tabs">
              <button id="tab-files" class="side-tab active">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M1.8 4.2c0-.4.3-.7.7-.7h3.4l1.3 1.5h6.3c.4 0 .7.3.7.7v6.8c0 .4-.3.7-.7.7H2.5c-.4 0-.7-.3-.7-.7V4.2Z"/></svg>
                文件
              </button>
              <button id="tab-outline" class="side-tab">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M5.5 4h9M5.5 8h9M5.5 12h9"/><circle cx="2.4" cy="4" r="0.9" fill="currentColor" stroke="none"/><circle cx="2.4" cy="8" r="0.9" fill="currentColor" stroke="none"/><circle cx="2.4" cy="12" r="0.9" fill="currentColor" stroke="none"/></svg>
                大纲
              </button>
            </div>
          </div>
          <div id="outline"></div>
          <div id="tree"></div>
          <div id="sidebar-footer">
            <button id="btn-add-file" class="icon-btn small" title="新建文件">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
            </button>
            <button id="btn-add-folder" class="icon-btn small" title="新建文件夹">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M1.8 4.2c0-.4.3-.7.7-.7h3.4l1.3 1.5h6.3c.4 0 .7.3.7.7v6.8c0 .4-.3.7-.7.7H2.5c-.4 0-.7-.3-.7-.7V4.2Z"/><path d="M8 7v4M6 9h4" stroke-linecap="round"/></svg>
            </button>
            <span id="ws-path"></span>
            <button id="btn-close-ws" title="关闭工作空间">关闭</button>
          </div>
          <div id="sidebar-resize" title="拖动调整宽度"></div>
        </aside>

        <main id="content">
          <div id="editor-empty" class="hidden">
            <div class="empty-inner">
              <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M28 6H12a3 3 0 0 0-3 3v30a3 3 0 0 0 3 3h24a3 3 0 0 0 3-3V17L28 6Z"/><path d="M28 6v11h11"/><path d="M17 24h14M17 31h14"/></svg>
              <p>从左侧选择一个 Markdown 文件，或新建一个</p>
              <button id="btn-new-file" class="btn-primary small">新建文件</button>
            </div>
          </div>
          <div id="editor-wrap" class="hidden"><div id="editor"></div></div>
          <div id="source-wrap" class="hidden">
            <textarea id="source-editor" aria-label="Markdown 纯文本编辑器" placeholder="在这里编辑 Markdown 源文本…" spellcheck="false" wrap="off"></textarea>
          </div>
          <div id="count" class="hidden"></div>
        </main>
      </div>
    </div>

    <!-- 链接编辑浮层 -->
    <div id="link-popover" class="hidden">
      <input id="link-input" type="text" placeholder="https://…" spellcheck="false" />
      <button id="link-apply" class="btn-primary mini">确定</button>
      <button id="link-remove" class="btn-ghost mini">移除</button>
      <button id="link-cancel" class="btn-ghost mini">取消</button>
    </div>

    <!-- 设置中心：左侧分类，右侧承载可持续扩展的设置项 -->
    <div id="settings-backdrop" class="settings-backdrop hidden">
      <section id="settings-window" class="settings-window" role="dialog" aria-modal="true" aria-labelledby="settings-heading">
        <header class="settings-header">
          <h2 id="settings-heading">设置</h2>
          <button id="btn-settings-close" class="settings-close" aria-label="关闭设置" title="关闭">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="m4 4 8 8M12 4l-8 8"/></svg>
          </button>
        </header>
        <div class="settings-body">
          <nav class="settings-nav" aria-label="设置分类">
            <button class="settings-nav-item active" data-settings-page="images">
              <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"><rect x="2.2" y="3" width="13.6" height="12" rx="2"/><circle cx="6.1" cy="6.7" r="1.25"/><path d="m3.2 13 3.6-3.5 2.6 2.4 2-1.8 3.4 2.9"/></svg>
              图片
            </button>
            <button class="settings-nav-item" data-settings-page="appearance">
              <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2.1a6.9 6.9 0 1 0 6.9 6.9c0-.7-.6-1.2-1.3-1.2h-1.2c-1.1 0-1.8-1.2-1.2-2.1l.6-.9c.4-.7.1-1.6-.6-1.9A6.8 6.8 0 0 0 9 2.1Z"/><circle cx="5.2" cy="8.1" r=".65" fill="currentColor" stroke="none"/><circle cx="7.2" cy="5.2" r=".65" fill="currentColor" stroke="none"/><circle cx="10.6" cy="4.7" r=".65" fill="currentColor" stroke="none"/></svg>
              外观
            </button>
          </nav>

          <main class="settings-content">
            <section class="settings-page" data-settings-panel="images">
              <div class="settings-page-heading">
                <h3>图片</h3>
                <p>控制粘贴、拖入和选择图片时的本地存储位置。</p>
              </div>
              <div class="settings-group">
                <div class="settings-group-title">存储位置</div>
                <label class="settings-option">
                  <input type="radio" name="image-storage" value="file-assets" />
                  <span><strong>当前文件目录的 assets</strong><small>例如 docs/笔记.md → docs/assets/</small></span>
                </label>
                <label class="settings-option">
                  <input type="radio" name="image-storage" value="custom" />
                  <span><strong>指定目录</strong><small id="image-custom-path">尚未选择目录</small></span>
                  <button id="btn-image-directory" class="settings-choose" type="button">选择…</button>
                </label>
                <label class="settings-option">
                  <input type="radio" name="image-storage" value="document-assets" />
                  <span><strong>每个文档单独目录</strong><small>例如 笔记.md → assets.笔记/</small></span>
                </label>
              </div>
            </section>

            <section class="settings-page hidden" data-settings-panel="appearance">
              <div class="settings-page-heading">
                <h3>外观</h3>
                <p>选择应用界面使用的颜色模式。</p>
              </div>
              <div class="settings-group">
                <div class="settings-group-title">主题</div>
                <label class="settings-option">
                  <input type="radio" name="settings-theme" value="system" />
                  <span><strong>跟随系统</strong><small>自动匹配系统的浅色或深色外观</small></span>
                </label>
                <label class="settings-option">
                  <input type="radio" name="settings-theme" value="light" />
                  <span><strong>浅色</strong><small>始终使用浅色界面</small></span>
                </label>
                <label class="settings-option">
                  <input type="radio" name="settings-theme" value="neutral" />
                  <span><strong>中性（默认）</strong><small>柔和的浅暗色界面，比深色主题更轻</small></span>
                </label>
                <label class="settings-option">
                  <input type="radio" name="settings-theme" value="dark" />
                  <span><strong>深色</strong><small>始终使用深色界面</small></span>
                </label>
              </div>
            </section>
          </main>
        </div>
        <footer class="settings-footer">设置会自动保存</footer>
      </section>
    </div>

    <input type="file" id="file-input" accept="image/*" multiple hidden />
    <script type="module" src="/main.ts"></script>
  </body>
</html>
