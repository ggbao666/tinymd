appId: com.jianmo.editor
productName: tinymd
directories:
  output: release
files:
  - main.js
  - docx-export.cjs
  - preload.cjs
  - dist/renderer/**/*
  - build/icon.png
  - build/icon.ico
  - build/icon-window.png
  - package.json
fileAssociations:
  - ext: md
    name: Markdown 文档
    role: Editor
  - ext: markdown
    name: Markdown 文档
    role: Editor
win:
  target: nsis
  icon: build/icon.ico
# 国内镜像不放这里：@electron/get 的镜像优先级是「环境变量 > 配置」，
# 写进配置文件会让 CI（GitHub 海外 runner）也去访问 npmmirror。
# 镜像改由 npm run dist:win / dist:mac 通过 ELECTRON_MIRROR 传入，CI 走官方源。
nsis:
  perMachine: false
  artifactName: tinymd-${version}-setup.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
mac:
  target: dmg
  # 直接用 1024x1024 的 icon.png，electron-builder 会自行转成 .icns
  icon: build/icon.png
  category: public.app-category.productivity
  # 产物名带架构：--universal 时是 tinymd-<版本>-universal.dmg，
  # 若改回分别打 arm64/x64，也不会互相覆盖
  artifactName: tinymd-${version}-${arch}.${ext}
  # 没有 Apple 证书，显式启用 ad-hoc 签名（免费，不需要任何账号）。
  # 不写这一行时 electron-builder 找不到证书会「完全跳过签名」，产物在 Gatekeeper
  # 眼里属于「未签名」——它比 ad-hoc 更糟：签名结构缺失/不完整，对话框可能连
  # 「打开」都不给，只剩「移到废纸篓」。ad-hoc 只证明「签完之后没被改过」、
  # 不代表身份，依旧过不了 Gatekeeper，但判定会走到「弹一次确认框、可放行」。
  #
  # hardenedRuntime 默认 true，ad-hoc 下会强制库验证，进而拒绝 Team ID 不同的
  # 预签名 Electron 框架导致启动崩溃；所需的 disable-library-validation 键
  # electron-builder 内置的 entitlements 模板已包含，无需自备 plist。
  identity: "-"
