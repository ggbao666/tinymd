appId: com.jianmo.editor
productName: tinymd
directories:
  output: release
files:
  - main.js
  - preload.cjs
  - dist/renderer/**/*
  - build/icon.png
  - build/icon.ico
  - build/icon-window.png
  - package.json
fileAssociations:
  - ext: md
    name: Markdown 文档
    role: Editor
  - ext: markdown
    name: Markdown 文档
    role: Editor
win:
  target: nsis
  icon: build/icon.ico
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
nsis:
  perMachine: false
  artifactName: tinymd-${version}-setup.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
mac:
  target: dmg
  # 直接用 1024x1024 的 icon.png，electron-builder 会自行转成 .icns
  icon: build/icon.png
  category: public.app-category.productivity
  # 同时出 arm64 与 x64 两个 dmg，产物名必须带架构，否则互相覆盖
  artifactName: tinymd-${version}-${arch}.${ext}
